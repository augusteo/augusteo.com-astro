<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Stylized topographic map with two diverging paths and a compass rose, evoking the scout's question 'Is it true?'">
  <defs>
    <pattern id="paper" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect width="6" height="6" fill="#FAF8F4"/>
      <circle cx="3" cy="3" r="0.3" fill="#E5DFD2" opacity="0.5"/>
    </pattern>
    <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence baseFrequency="1.2" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>

  <!-- Topographic contour lines (book's "scout's terrain map" metaphor) -->
  <g fill="none" stroke="#C8B6A0" stroke-width="0.8" opacity="0.75">
    <path d="M -50,520 Q 200,470 420,490 T 900,460 T 1250,440"/>
    <path d="M -50,480 Q 200,420 420,450 T 900,410 T 1250,380"/>
    <path d="M -50,440 Q 200,370 420,410 T 900,350 T 1250,320"/>
    <path d="M -50,400 Q 200,320 420,370 T 900,290 T 1250,260"/>
    <path d="M -50,360 Q 200,280 420,330 T 900,240 T 1250,210"/>
    <path d="M -50,320 Q 200,250 420,300 T 900,200 T 1250,170"/>
    <path d="M -50,280 Q 200,225 420,275 T 900,170 T 1250,140"/>
  </g>

  <!-- Soldier path (defends a line; tight loop returning) -->
  <g fill="none" stroke="#9C7853" stroke-width="2.4" stroke-linecap="round" opacity="0.85">
    <path d="M 240,560 Q 260,500 290,470 Q 320,440 305,400 Q 290,360 320,340 Q 350,320 335,290 Q 320,260 350,250"
      stroke-dasharray="0" />
    <!-- arrowhead pointing back inward -->
    <path d="M 343,256 L 350,250 L 358,256" fill="none" stroke="#9C7853" stroke-width="2.4" stroke-linejoin="round"/>
  </g>

  <!-- Scout path (explores forward; longer, leaves the frame) -->
  <g fill="none" stroke="#5A7B6B" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
    <path d="M 240,560 Q 280,510 340,490 Q 410,470 470,430 Q 540,380 620,360 Q 720,330 810,280 Q 900,230 1000,180"/>
    <!-- arrowhead pointing forward -->
    <path d="M 992,188 L 1000,180 L 1008,192" fill="none" stroke="#5A7B6B" stroke-width="2.4" stroke-linejoin="round"/>
  </g>

  <!-- Path junction marker (where they diverge) -->
  <circle cx="240" cy="560" r="5" fill="#1A1A1A"/>

  <!-- Compass rose, upper right -->
  <g transform="translate(1010, 130)">
    <circle cx="0" cy="0" r="58" fill="#FAF8F4" stroke="#1A1A1A" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#C8B6A0" stroke-width="0.8" stroke-dasharray="2,3"/>
    <g fill="#1A1A1A">
      <!-- N pointer (filled triangle) -->
      <polygon points="0,-50 -7,0 0,-8 7,0" stroke="#1A1A1A" stroke-width="0.6"/>
      <!-- S pointer (outline) -->
      <polygon points="0,50 -7,0 0,8 7,0" fill="#FAF8F4" stroke="#1A1A1A" stroke-width="0.6"/>
      <!-- E pointer -->
      <polygon points="50,0 0,-7 8,0 0,7" fill="#FAF8F4" stroke="#1A1A1A" stroke-width="0.6"/>
      <!-- W pointer -->
      <polygon points="-50,0 0,-7 -8,0 0,7" fill="#FAF8F4" stroke="#1A1A1A" stroke-width="0.6"/>
    </g>
    <text x="0" y="-66" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#6B6258">N</text>
    <text x="68" y="4" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#6B6258">E</text>
    <text x="0" y="76" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#6B6258">S</text>
    <text x="-68" y="4" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#6B6258">W</text>
  </g>

  <!-- The two questions (scout's central asking, set off in the open terrain) -->
  <g font-family="Inter, system-ui, sans-serif">
    <text x="540" y="190" font-size="42" font-weight="600" fill="#1A1A1A" text-anchor="middle" font-style="italic">"Is it true?"</text>
    <text x="540" y="220" font-size="14" fill="#6B6258" text-anchor="middle">the scout's question</text>
  </g>

  <!-- Small markers along the paths -->
  <g fill="#1A1A1A">
    <circle cx="340" cy="490" r="2"/>
    <circle cx="470" cy="430" r="2"/>
    <circle cx="620" cy="360" r="2"/>
    <circle cx="810" cy="280" r="2"/>
  </g>

  <!-- Subtle legend bottom-left -->
  <g font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B6258">
    <line x1="40" y1="595" x2="74" y2="595" stroke="#5A7B6B" stroke-width="2.4"/>
    <text x="82" y="599" text-anchor="start" fill="#1A1A1A">scout</text>
    <text x="120" y="599" text-anchor="start">explores and updates</text>
    <line x1="260" y1="595" x2="294" y2="595" stroke="#9C7853" stroke-width="2.4"/>
    <text x="302" y="599" text-anchor="start" fill="#1A1A1A">soldier</text>
    <text x="346" y="599" text-anchor="start">defends a position</text>
  </g>
</svg>
